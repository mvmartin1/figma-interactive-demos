<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 779" preserveAspectRatio="none" fill="none">
  <defs>
    <linearGradient id="bg" x1="284" y1="541" x2="294" y2="-430" gradientUnits="userSpaceOnUse">
      <stop offset="0.0464024" stop-color="white" stop-opacity="0"/>
      <stop offset="0.21171" stop-color="#4E96FF"/>
      <stop offset="0.391196" stop-color="#0054D4"/>
    </linearGradient>
    <!-- Asymmetric Gaussian blurs match Figma's squished container scaling
         (original blur σ * container_dim / natural_svg_dim, per-axis). -->
    <filter id="b1" x="-100%" y="-200%" width="300%" height="500%">
      <feGaussianBlur stdDeviation="47.4 31.18"/>
    </filter>
    <filter id="b2" x="-100%" y="-200%" width="300%" height="500%">
      <feGaussianBlur stdDeviation="23.69 11.66"/>
    </filter>
  </defs>
  <rect width="375" height="779" fill="url(#bg)"/>
  <!-- Cream halo behind orange spot, screen-blend over blue base.
       cy raised from Figma's 356/339 to sit behind the hero amount and emerge
       from the balance-card top, matching the "shining on the number" mock. -->
  <g style="mix-blend-mode: lighten">
    <ellipse cx="185.83" cy="256" rx="97.9" ry="31.3" fill="#FFE6A2" filter="url(#b1)"/>
  </g>
  <ellipse cx="187" cy="239" rx="61.6" ry="8.84" fill="#FF7E47" filter="url(#b2)"/>
</svg>
